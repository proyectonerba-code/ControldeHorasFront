<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/api-client.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJMClock — Recuperar equipo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="app d-flex min-vh-100 flex-column">
    <main class="flex-fill d-flex align-items-center justify-content-center py-4 px-3">
      <section class="login-card shadow-sm">
        <div class="text-center mb-4">
          <div class="text-danger fw-bold fs-4">JJMClock</div>
          <h1 class="h5 mt-3">Recuperar equipo anterior</h1>
          <p class="small text-muted">Solo necesitas esto si ya tenías datos guardados en una versión previa.</p>
        </div>
        <div id="msg" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>
        <form id="formRecuperar">
          <div class="mb-2"><label class="form-label" for="codigoEmpresa">Código actual de empresa</label><input id="codigoEmpresa" class="form-control" required autocomplete="organization"></div>
          <div class="mb-2"><label class="form-label" for="codigoTemporal">Código temporal de configuración</label><input id="codigoTemporal" class="form-control" required autocomplete="one-time-code"></div>
          <div class="mb-2"><label class="form-label" for="nombreAdmin">Tu nombre</label><input id="nombreAdmin" class="form-control" required autocomplete="name"></div>
          <div class="mb-2"><label class="form-label" for="correoAdmin">Tu correo</label><input id="correoAdmin" type="email" class="form-control" required autocomplete="email"></div>
          <div class="mb-3"><label class="form-label" for="passwordAdmin">Crea una contraseña</label><input id="passwordAdmin" type="password" class="form-control" minlength="8" required autocomplete="new-password"></div>
          <button type="submit" class="btn btn-danger w-100">Configurar administrador y entrar</button>
        </form>
        <div class="text-center mt-3"><a href="/login.html" class="small">Volver al acceso</a></div>
      </section>
    </main>
  </div>
  <script>
    const form = document.getElementById('formRecuperar');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const response = await fetch('/api/registro/admin-inicial', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            codigo_empresa: document.getElementById('codigoEmpresa').value.trim(),
            codigo_configuracion: document.getElementById('codigoTemporal').value.trim(),
            nombre: document.getElementById('nombreAdmin').value,
            correo: document.getElementById('correoAdmin').value,
            password: document.getElementById('passwordAdmin').value
          })
        });
        const data = await response.json();
        if (!data.ok) {
          msg.textContent = data.error || 'No se pudo recuperar el equipo.';
          msg.className = 'alert alert-danger';
          return;
        }
        window.location.replace('/admin.html');
      } catch (error) {
        msg.textContent = 'No se pudo conectar con el servidor.';
        msg.className = 'alert alert-danger';
      }
    });
  </script>
</body>
</html>
